<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo Aritmético</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="quadro">     
    <h2>Forneça os dados abaixo:</h2>
    <label> Numero 1: <input type="number" id="N1" ></label> <br>
    <label> Numero 2: <input type="number" id="N2" ></label> <br>
    <label> Operação <input type="text" id="operacao" ></label> <br>
    <button onclick = "calcular()"> Calcular </button>
</div>


<script>


function calcular(){
    let n1= parseFloat(document.getElementById("N1").value)
    let n2= parseFloat(document.getElementById("N2").value)
    let operacao= document.getElementById("operacao").value.toLowerCase();


    if(isNaN(n1) || isNaN(n2) || operacao !== "soma" && operacao !== "subtração"){
    alert("Insira novamente"); 
    return;
    }

    //soma ou subtração//

    let resultado;
    if (operacao === "soma"){
        resultado= n1 + n2
    }
    else if (operacao === "subtração"){
        resultado= n1 - n2
    }


    

    alert(`O valor da ${operacao} entre os dois números é ${resultado} `);
}
</script>    
</body>
</html>
