<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Folha de Pagamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="quadro"> 
    <h2>Calculadora de Salário</h2>

    <label for="salarioMinimo">Salário Mínimo:</label>
    <input type="number" id="salarioMinimo" min="0" step="0.01"><br>

    <label for="turno">Turno:</label>
    <input type="text" id="turno" ><br>

    <label for="categoria">Categoria:</label>
    <input type="text" id="categoria" ><br>

    <label for="horasTrabalhadas">Horas Trabalhadas:</label>
    <input type="number" id="horasTrabalhadas" min="0" step="1"><br>

    <button onclick="calcularSalario()">Calcular</button>
</div> 
    
    <p id="resultado"></p>

    <script>
        function calcularSalario() {
            let salarioMinimo = parseFloat(document.getElementById("salarioMinimo").value);
            let turno = document.getElementById("turno").value.toLowerCase();
            let categoria = document.getElementById("categoria").value.toLowerCase();
            let horasTrabalhadas = parseInt(document.getElementById("horasTrabalhadas").value);

            if (isNaN(salarioMinimo) || isNaN(horasTrabalhadas) || turno !== "matutino" && turno !== "vespertino" && turno !== "noturno" || categoria !== "gerente" && categoria !== "funcionario") {
                alert("Por favor, insira valores válidos!");
                return;
            }

            let valorHora;
            switch (categoria) {
                case "funcionário":
                    if (turno === "matutino" || turno === "vespertino") {
                        valorHora = salarioMinimo * 0.10; // 10% do salário mínimo
                    } else { // Noturno
                        valorHora = salarioMinimo * 0.15; // 15% do salário mínimo
                    }
                    break;
                case "gerente":
                    if (turno === "matutino" || turno === "vespertino") {
                        valorHora = salarioMinimo * 0.20; // 20% do salário mínimo
                    } else { // Noturno
                        valorHora = salarioMinimo * 0.25; // 25% do salário mínimo
                    }
                    break;
            }

            let salarioInicial = valorHora * horasTrabalhadas;
            let auxilioAlimentacao;

            if (salarioInicial <= 800) {
                auxilioAlimentacao = salarioInicial * 0.25; // 25%
            } else if (salarioInicial <= 1200) {
                auxilioAlimentacao = salarioInicial * 0.20; // 20%
            } else {
                auxilioAlimentacao = salarioInicial * 0.15; // 15%
            }

            let salarioFinal = salarioInicial + auxilioAlimentacao;

            
                alert(`Valor da Hora Trabalhada: R$ ${valorHora.toFixed(2)}`)
                alert(`Salário Inicial: R$ ${salarioInicial.toFixed(2)}`)
                alert(`Auxílio-Alimentação:R$ ${auxilioAlimentacao.toFixed(2)}`)
                alert(`Salário Final: R$ ${salarioFinal.toFixed(2)}`)
            ;
        }
    </script>

</body>
</html>
