<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificação da Média Ponderada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="quadro">    
    <h2>Digite sua nota em cada disciplina</h2>
    <label>Atividade prática  <br> <input type="number" id="N1"></label><br><br>
    <label>Trabalho teórico: <br> <input type="number" id="N2"></label><br><br>
    <label>Prova do Semestre: <br> <input type="number" id="N3"></label><br><br>
    <button onclick="calcularMedia()">Confirmar</button>
    <p id="resultado"></p>
</div>
    <script>
        function calcularMedia() {
            let N1 = parseFloat(document.getElementById("N1").value);
            let N2 = parseFloat(document.getElementById("N2").value);
            let N3 = parseFloat(document.getElementById("N3").value);

            // Verifica se os valores são válidos (entre 0 e 10)
            if (isNaN(N1) || isNaN(N2) || isNaN(N3) || N1 < 0 || N1 > 10 || N2 < 0 || N2 > 10 || N3 < 0 || N3 > 10) {
                alert("Digite notas válidas (entre 0 e 10)!");
                return;
            }

            // Cálculo da média ponderada correta
            let media = ((2 * N1) + (3 * N2) + (5 * N3)) / 10;
            let classificacao = "";

            // Definição da classificação correta
            if (media < 5) {
                classificacao = "F";
            } else if (media < 6) {
                classificacao = "E";
            } else if (media < 7) {
                classificacao = "D";
            } else if (media < 8) {
                classificacao = "C";
            } else if (media < 9) {
                classificacao = "B";
            } else {
                classificacao = "A";
            }

            // Exibe o resultado arredondado para 2 casas decimais
            alert(`A média do aluno é ${media.toFixed(2)} e sua classificação é ${classificacao}`);
        }
    </script>
</body>
</html>
